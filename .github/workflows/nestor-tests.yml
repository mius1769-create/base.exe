name: NeSToR tests

on:
  push:
    branches: ["claude/**"]
    paths: ["nestor/**", ".github/workflows/nestor-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Обычная (не администратор) локальная учётная запись — только в одноразовом runner —
      # для проверки, что каталог временных загрузок недоступен другим пользователям.
      # Пароль: маскируется в логе и передаётся файлом в RUNNER_TEMP, не переменной окружения.
      - name: Create unprivileged probe user
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pw = "Nq7!" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "aZ"
          Write-Output "::add-mask::$pw"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name "nestor_probe" -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -SID "S-1-5-32-545" -Member "nestor_probe"
          $admins = Get-LocalGroupMember -SID "S-1-5-32-544" | Where-Object { $_.Name -like "*\nestor_probe" }
          if ($admins) { throw "probe user must not be an administrator" }
          $pwFile = Join-Path $env:RUNNER_TEMP "nestor_probe.pw"
          [System.IO.File]::WriteAllText($pwFile, $pw)
          "NESTOR_PROBE_USER=nestor_probe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NESTOR_PROBE_PASSWORD_FILE=$pwFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Staging directory check at launch
        shell: bash
        run: python run_nestor.py --check-staging --var-dir "$RUNNER_TEMP/nestor-var"

      # Сценарий сборки тестового каталога (синтетические входы): PowerShell 7 на Linux,
      # Windows PowerShell 5.1 — ниже, от обычной учётной записи.
      - name: Test catalog build script (pwsh, synthetic inputs)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          python tests/synthetic_release.py "$env:RUNNER_TEMP/release" | Out-Null
          ./tools/Build-TestCatalog.ps1 -Release "$env:RUNNER_TEMP/release/Synthetic_expert.tar.gz" `
            -Candidate "$env:RUNNER_TEMP/release/Synthetic_candidate.db" -VarDir "$env:RUNNER_TEMP/catvar" `
            -ExpectedFile "$env:RUNNER_TEMP/release/expected.json"

      # NeSToR от ОБЫЧНОЙ учётной записи (не Administrators, не RID 500) и проверка,
      # что вторая обычная учётная запись не читает её каталог загрузок.
      # Учётные записи существуют только в этом одноразовом runner; пароли не покидают шаг.
      - name: Run NeSToR as unprivileged users
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $out = "C:\nestor_ci"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          icacls $out /grant "*S-1-5-32-545:(OI)(CI)M" | Out-Null
          Copy-Item -Recurse -Force nestor "$out\app"
          function New-ProbeUser([string]$name) {
            $pw = "Nq7!" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "aZ"
            Write-Host "::add-mask::$pw"   # Write-Host: не попадает в возвращаемое значение функции
            $sec = ConvertTo-SecureString $pw -AsPlainText -Force
            New-LocalUser -Name $name -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
            Add-LocalGroupMember -SID "S-1-5-32-545" -Member $name | Out-Null
            if (Get-LocalGroupMember -SID "S-1-5-32-544" | Where-Object { $_.Name -like "*\$name" }) { throw "$name is an administrator" }
            return New-Object System.Management.Automation.PSCredential(".\$name", $sec)
          }
          function Invoke-As($cred, [string[]]$pyArgs, [string]$tag) {
            $py = (Get-Command python).Source
            $p = Start-Process -FilePath $py -ArgumentList $pyArgs -Credential $cred -LoadUserProfile `
                   -WorkingDirectory "$out\app" -RedirectStandardOutput "$out\$tag.out" `
                   -RedirectStandardError "$out\$tag.err" -Wait -PassThru
            Write-Output "===== $tag (exit $($p.ExitCode)) ====="
            Get-Content "$out\$tag.out" -Encoding UTF8
            Get-Content "$out\$tag.err" -Encoding UTF8
            if ($p.ExitCode -ne 0) { throw "$tag failed with exit code $($p.ExitCode)" }
          }
          # синтетические «исходный архив» и кандидат для сборки тестового каталога
          python "$out\app\tests\synthetic_release.py" "$out\release" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "synthetic_release failed" }
          function Invoke-PsAs($cred, [string]$release, [string]$tag) {
            $py = (Get-Command python).Source
            $ps = (Get-Command powershell).Source
            $a = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$out\app\tools\Build-TestCatalog.ps1",
                   "-Release", "$out\release\$release", "-Candidate", "$out\release\Synthetic_candidate.db",
                   "-VarDir", "$out\catvar-$tag", "-Python", $py, "-ExpectedFile", "$out\release\expected.json")
            $p = Start-Process -FilePath $ps -ArgumentList $a -Credential $cred -LoadUserProfile `
                   -WorkingDirectory "$out\app" -RedirectStandardOutput "$out\$tag.out" `
                   -RedirectStandardError "$out\$tag.err" -Wait -PassThru
            Write-Output "===== $tag (exit $($p.ExitCode)) ====="
            Get-Content "$out\$tag.out" -Encoding UTF8
            Get-Content "$out\$tag.err" -Encoding UTF8
            if ($p.ExitCode -ne 0) { throw "$tag failed with exit code $($p.ExitCode)" }
          }
          try {
            $main = New-ProbeUser "nestor_main"
            $other = New-ProbeUser "nestor_other"
            Invoke-As $main @("tools/ci_windows_probe.py", "main", "--out", $out) "main"
            Invoke-As $main @("run_nestor.py", "--check-staging", "--var-dir", "$out\check-var") "check-staging-main"
            Invoke-As $other @("tools/ci_windows_probe.py", "other", "--out", $out) "other"
            Invoke-PsAs $main "Synthetic_expert.tar.gz" "catalog-main-targz"
            Invoke-PsAs $main "Synthetic_expert.zip" "catalog-main-zip"
            $rep = Get-Content -Raw -Encoding UTF8 "$out\catvar-catalog-main-targz\test_catalog\BUILD_REPORT.json" | ConvertFrom-Json
            if (-not $rep.ok -or -not $rep.enabled) { throw "catalog report not ok" }
            if (-not (Test-Path "$out\catvar-catalog-main-targz\test_catalog\ENABLED")) { throw "catalog not enabled" }
            Write-Output "catalog build as non-admin: ok, records=$($rep.counts.records)"
          } finally {
            foreach ($n in "nestor_main", "nestor_other") { Remove-LocalUser -Name $n -ErrorAction SilentlyContinue }
          }

      # Удаление учётной записи и файла с паролем — при успехе и при ошибке.
      - name: Remove probe user
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $names = "nestor_probe", "nestor_main", "nestor_other"
          foreach ($n in $names) { Remove-LocalUser -Name $n -ErrorAction SilentlyContinue }
          Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -match "\\nestor_(probe|main|other)" } |
            Remove-CimInstance -ErrorAction SilentlyContinue
          if ($env:NESTOR_PROBE_PASSWORD_FILE) { Remove-Item -Force -ErrorAction SilentlyContinue $env:NESTOR_PROBE_PASSWORD_FILE }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\nestor_ci"
          foreach ($n in $names) { if (Get-LocalUser -Name $n -ErrorAction SilentlyContinue) { throw "$n still exists" } }
          if ($env:NESTOR_PROBE_PASSWORD_FILE -and (Test-Path $env:NESTOR_PROBE_PASSWORD_FILE)) { throw "password file still exists" }
          Write-Output "probe users, their profiles and password file removed"
